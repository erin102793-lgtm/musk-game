<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>馬斯克的揮霍遊戲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky ledger band (balance, spend meter, category tabs) above a scrolling price list; checkout dock fixed at the bottom; receipt sheet slides over everything. */
:root{
  --bg:#EDEFF1; --surface:#FFFFFF; --fg:#10151B; --muted:#56626E; --line:#CBD2D9;
  --accent:#D4400B; --accent-fg:#FFFFFF; --track:#D9DEE3;
  --display:'Big Shoulders Display','Noto Sans TC',Impact,sans-serif;
  --body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1216; --surface:#161C22; --fg:#E9EDF0; --muted:#93A0AB; --line:#27313A;
    --accent:#FF6B2C; --accent-fg:#150E09; --track:#222B33; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1216; --surface:#161C22; --fg:#E9EDF0; --muted:#93A0AB; --line:#27313A;
  --accent:#FF6B2C; --accent-fg:#150E09; --track:#222B33; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select{font-family:inherit}

.in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{padding-block:22px 16px}
.eyebrow{margin:0 0 6px;font:500 12px var(--mono);letter-spacing:.08em;color:var(--muted)}
h1{margin:0;font:800 clamp(34px,10vw,54px)/1.05 var(--display);text-wrap:balance}
.lede{margin:10px 0 0;color:var(--muted);max-width:34em}

.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.band .in{padding-top:10px}
.bal-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lab{font:500 12px var(--mono);letter-spacing:.08em;color:var(--muted)}
.zh{font:500 13px var(--mono);color:var(--muted);text-align:right}
.bal{font:800 clamp(30px,9.6vw,48px)/1.05 var(--display);letter-spacing:.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.broke .bal{color:var(--accent)}
.meter{height:4px;background:var(--track);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:6px -12px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:500 14px var(--body);padding:10px 12px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font:500 11px var(--mono);color:var(--accent);margin-left:5px}

main.in{padding-bottom:130px}
.tools{display:flex;gap:10px;flex-wrap:wrap;padding-block:14px}
.ghost{appearance:none;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:4px;height:40px;padding:0 14px;font:500 14px var(--body);cursor:pointer}
.ghost.hot{border-color:var(--accent);color:var(--accent)}

.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.meta{min-width:0}
.item h3{margin:0;font:500 16px/1.35 var(--body);overflow-wrap:anywhere}
.item p{margin:2px 0 0;color:var(--muted);font-size:13px}
.price{font:500 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.ctl{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.b{appearance:none;width:40px;height:40px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;font:500 20px/1 var(--mono);cursor:pointer}
.q{width:92px;height:40px;text-align:center;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.max{appearance:none;height:40px;padding:0 12px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:4px;font:500 12px var(--mono);letter-spacing:.06em;cursor:pointer}
.sub{margin-left:auto;font:400 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-align:right}
.item.on .q{color:var(--accent);border-color:var(--accent)}
.item.on .sub{color:var(--fg)}
.item.no .meta,.item.no .price{opacity:.45}
.item.no .b[data-a="inc"],.item.no .max{opacity:.35;cursor:not-allowed}
.item.no .sub::after{content:"買不起";color:var(--muted)}
.item.no.on .sub::after{content:""}
.foot{margin:22px 0 0;color:var(--muted);font-size:12px;line-height:1.7}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{display:flex;gap:10px;align-items:center;padding-block:10px}
.step{display:flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--muted);flex:none}
.step select{height:44px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:0 6px;font:500 14px var(--mono)}
.go{flex:1;min-width:0;height:44px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:4px;font:700 16px var(--body);cursor:pointer}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rc{background:var(--surface);border:1px solid var(--line);padding:20px 18px;margin-block:16px 24px}
.rc h2{margin:0 0 4px;font:800 32px/1.1 var(--display)}
.verdict{margin:6px 0 14px;color:var(--muted)}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px dashed var(--line);font:400 13px var(--mono)}
.ln span{min-width:0;overflow-wrap:anywhere}
.ln small{display:block;color:var(--muted);font-size:12px}
.ln b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.ln.tot{border-bottom:1px solid var(--fg);font-size:14px}
.res{padding:18px 0 6px}
.remain{margin:2px 0 0;font:800 clamp(34px,11vw,56px)/1.05 var(--display);color:var(--accent);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.fer{margin:14px 0 0;font-size:18px}
.fer b{font:800 40px/1 var(--display);color:var(--accent);margin:0 4px}
.note{margin:6px 0 0;color:var(--muted);font-size:12px}
details{margin-top:14px}
summary{cursor:pointer;font:500 14px var(--body);padding-block:6px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.acts .go{flex:1 1 140px}
.acts .ghost{flex:1 1 140px;height:44px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top"><div class="in">
  <p class="eyebrow">2026 價目表 · 新台幣 · US$1 ≈ NT$31</p>
  <h1>馬斯克的揮霍遊戲</h1>
  <p class="lede">戶頭裡有新台幣 29 億元。挑商品、調數量，把錢花光，最後結帳看還剩多少、還能買幾台法拉利。</p>
</div></header>

<div class="band"><div class="in">
  <div class="bal-row"><span class="lab">剩餘資金 TWD</span><span class="zh" id="zh"></span></div>
  <div class="bal" id="bal"></div>
  <div class="meter" aria-hidden="true"><i id="fill"></i></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="商品類別"></nav>
</div></div>

<main class="in">
  <section class="tools">
    <button class="ghost hot" id="spree" type="button">隨機揮霍</button>
    <button class="ghost" id="reset" type="button">全部歸零</button>
  </section>
  <div id="list"></div>
  <p class="foot">價格為 2026 年的公開定價或市場概略行情，依 US$1 ≈ NT$31 換算，部分為二手收藏價，僅供遊戲參考。飲食與小確幸直接以新台幣概略價計，餐廳為每人價，實際依菜單與服務費而定。法拉利以 Purosangue 約 US$400,000 換算。</p>
</main>

<div class="dock"><div class="in">
  <label class="step" for="step">每次
    <select id="step" aria-label="每次增減數量">
      <option value="1">±1</option><option value="10">±10</option><option value="100">±100</option>
      <option value="1000">±1,000</option><option value="10000">±10,000</option><option value="100000">±100,000</option>
      <option value="1000000">±1,000,000</option>
    </select>
  </label>
  <button class="go" id="go" type="button">結帳</button>
</div></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="結帳明細" hidden>
  <div class="in" id="sheetBody"></div>
</div>

      ['Passion Diamond 鑽石高跟鞋','杜拜 · 紀錄款',17000000]
    ]},
    {id:'f', name:'飲食', twd:true, items:[
      ['鼎泰豐小籠包套餐','小籠包 · 炒飯 · 湯品，每人',600],
      ['五星飯店下午茶','三層點心 · 茶飲，每人',1800],
      ['高級火鍋和牛套餐','肉盤 · 海鮮盤，每人',2200],
      ['五星飯店自助晚餐','海鮮 · 現切烤肉，每人',2800],
      ['欣葉頂級台菜宴席','合菜 · 熱炒，每人',3000],
      ['日式燒肉和牛套餐','A5 和牛 · 嚴選部位，每人',4500],
      ['法式餐廳品味套餐','前菜到甜點，每人',6000],
      ['頤宮粵式料理晚餐','港式 · 米其林星級，每人',8000],
      ['JL Studio 主廚套餐','創意料理 · 米其林星級，每人',8000],
      ['RAW 主廚晚餐','台灣食材 · 米其林星級，每人',9000],
      ['頂級鐵板燒套餐','松葉蟹 · 和牛，每人',10000],
      ['頂級板前壽司 Omakase','師傅現捏 · 每人',12000],
      ['法式餐廳搭餐酒套餐','全套 · 含酒款搭配，每人',18000],
      ['餐廳加點 Pétrus 一瓶','波爾多名莊',150000],
      ['私廚主廚到府餐會','10 人份 · 全套',250000],
      ['Romanée-Conti 一瓶','布根地 · 夢幻酒款',700000]
    ]},
    {id:'k', name:'小確幸', twd:true, items:[
      ['茶葉蛋','超商 · 一顆',13],
      ['捷運單程','台北捷運 · 起跳',20],
      ['超商美式咖啡','中杯 · 一杯',45],
      ['夜市烤玉米','一支',60],
      ['珍珠奶茶','手搖 · 一杯',70],
      ['蚵仔煎','夜市 · 一份',70],
      ['雞排','夜市 · 一塊',90],
      ['便當','排骨 / 雞腿 · 一個',100],
      ['鹽酥雞','綜合 · 一袋',120],
      ['星巴克大杯拿鐵','一杯',165],
      ['牛肉麵','紅燒 · 一碗',250],
      ['鼎泰豐小籠包','一籠 10 顆',270],
      ['芒果冰','一盤',280],
      ['電影票','全票 · 一張',330],
      ['珍珠奶茶 加料升級','鮮奶 + 全套配料 · 一杯',500],
      ['夜市掃攤一整晚','10 個攤位吃到飽',1500],
      ['請全公司喝手搖','100 杯珍珠奶茶',7000]
    ]},
    {id:'y', name:'遊艇飛機', items:[
      ['私人潛艇 Triton 3300','載客 3 人 · 可潛 1,000 公尺',3000000],
      ['Airbus H160 直升機','VIP 內裝',17000000],
      ['Gulfstream G800','約 1 萬公里航程',72000000],
      ['Gulfstream G700','超遠程商務機',78000000],
      ['Bombardier Global 8000','高速商務機',78000000],
      ['太空旅行 · 地球軌道 1 席','私人載人任務',55000000],
      ['80 公尺超級遊艇','五層甲板 · 泳池',150000000],
      ['Boeing BBJ 787 VIP','空中宮殿',250000000],
      ['120 公尺超級遊艇','直升機機庫 · 潛艇艙',450000000],
      ['Azzam 級 180 公尺遊艇','全球最長級',600000000]
    ]}
  ];

  var ITEMS = [], byId = {};
  DATA.forEach(function(c){
    c.items.sort(function(a, b){ return a[2] - b[2]; });
    c.items.forEach(function(r, i){
      var it = {id:c.id + i, cat:c.id, name:r[0], sub:r[1], p:c.twd ? r[2] : Math.round(r[2] * FX)};
      ITEMS.push(it); byId[it.id] = it;
    });
  });
  var MINP = Math.min.apply(null, ITEMS.map(function(i){ return i.p; }));
  var qty = {}, step = 1, cur = DATA[0].id;

  function $(s){ return document.querySelector(s); }
  function num(n){ return n.toLocaleString('en-US'); }
  function twd(n){ return 'NT$' + num(n); }
  function zh(n){
    if (n < 10000) return num(n);
    var units = [[1e12,'兆'],[1e8,'億'],[1e4,'萬']], out = [], r = n;
    for (var i = 0; i < units.length; i++){
      var k = Math.floor(r / units[i][0]);
      if (k > 0){ out.push(num(k) + units[i][1]); r -= k * units[i][0]; }
      if (out.length === 2) break;
    }
    return out.join(' ');
  }
  function spent(){
    var s = 0;
    for (var k in qty) s += qty[k] * byId[k].p;
    return s;
  }

  function renderTabs(){
    $('#tabs').innerHTML = DATA.map(function(c){
      return '<button class="tab" role="tab" id="t-' + c.id + '" data-cat="' + c.id + '" aria-selected="' + (c.id === cur) + '">' +
        c.name + '<span class="n" data-n="' + c.id + '"></span></button>';
    }).join('');
  }

  function rowHTML(it){
    var q = qty[it.id] || 0;
    return '<article class="item' + (q ? ' on' : '') + '" data-id="' + it.id + '">' +
      '<div class="meta"><h3>' + it.name + '</h3><p>' + it.sub + '</p></div>' +
      '<div class="price">' + twd(it.p) + '</div>' +
      '<div class="ctl">' +
        '<button class="b" type="button" data-a="dec" aria-label="減少 ' + it.name + '">−</button>' +
        '<input class="q" id="q-' + it.id + '" type="text" inputmode="numeric" autocomplete="off" value="' + num(q) + '" aria-label="' + it.name + ' 數量">' +
        '<button class="b" type="button" data-a="inc" aria-label="增加 ' + it.name + '">+</button>' +
        '<button class="max" type="button" data-a="max" aria-label="' + it.name + ' 買到最多">MAX</button>' +
        '<span class="sub">' + (q ? '小計 ' + twd(q * it.p) : '') + '</span>' +
      '</div></article>';
  }

  function renderList(){
    var c = DATA.filter(function(x){ return x.id === cur; })[0];
    $('#list').innerHTML = ITEMS.filter(function(i){ return i.cat === c.id; }).map(rowHTML).join('');
    updateHeader();
  }

  function updateRow(id){
    var el = document.querySelector('.item[data-id="' + id + '"]');
    if (!el) return;
    var it = byId[id], q = qty[id] || 0;
    el.classList.toggle('on', q > 0);
    el.querySelector('.q').value = num(q);
    el.querySelector('.sub').textContent = q ? '小計 ' + twd(q * it.p) : '';
  }

  function updateHeader(){
    var s = spent(), rem = BUDGET - s;
    $('#bal').textContent = twd(rem);
    $('#zh').textContent = rem < MINP ? '已花光' : zh(rem) + ' 元';
    $('#fill').style.width = (s / BUDGET * 100) + '%';
    document.body.classList.toggle('broke', rem < MINP);
    var counts = {}, total = 0;
    for (var k in qty){ counts[byId[k].cat] = (counts[byId[k].cat] || 0) + 1; total++; }
    DATA.forEach(function(c){
      var n = document.querySelector('[data-n="' + c.id + '"]');
      if (n) n.textContent = counts[c.id] ? counts[c.id] : '';
    });
    $('#go').textContent = total ? '結帳 · 已選 ' + total + ' 項' : '結帳';
    document.querySelectorAll('.item').forEach(function(el){
      var it = byId[el.dataset.id], no = it.p > rem;
      el.classList.toggle('no', no);
      el.querySelector('[data-a="inc"]').disabled = no;
      el.querySelector('[data-a="max"]').disabled = no;
    });
  }

  function setQty(id, q){
    var it = byId[id];
    q = Math.floor(Number(q));
    if (!isFinite(q) && q !== Infinity) q = 0;
    var others = spent() - (qty[id] || 0) * it.p;
    var max = Math.floor((BUDGET - others) / it.p);
    q = Math.max(0, Math.min(max, q));
    if (q) qty[id] = q; else delete qty[id];
    updateRow(id);
    updateHeader();
  }

  $('#tabs').addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (!b) return;
    cur = b.dataset.cat;
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t === b ? 'true' : 'false'); });
    renderList();
    window.scrollTo(0, 0);
  });

  $('#list').addEventListener('click', function(e){
    var b = e.target.closest('button[data-a]'); if (!b || b.disabled) return;
    var id = b.closest('.item').dataset.id, q = qty[id] || 0, a = b.dataset.a;
    if (a === 'inc') setQty(id, q + step);
    else if (a === 'dec') setQty(id, q - step);
    else if (a === 'max') setQty(id, Infinity);
  });
  $('#list').addEventListener('change', function(e){
    if (!e.target.classList.contains('q')) return;
    var id = e.target.closest('.item').dataset.id;
    var v = parseInt(String(e.target.value).replace(/[^\d]/g, ''), 10) || 0;
    setQty(id, v);
    updateRow(id);
  });
  $('#list').addEventListener('focusin', function(e){
    if (e.target.classList.contains('q')) e.target.select();
  });
  $('#list').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.classList.contains('q')) e.target.blur();
  });
  $('#step').addEventListener('change', function(e){ step = Number(e.target.value); });

  $('#reset').addEventListener('click', function(){
    for (var k in qty) delete qty[k];
    renderList();
  });

  $('#spree').addEventListener('click', function(){
    var rem = BUDGET - spent(), guard = 0;
    while (rem >= MINP && guard++ < 6000){
      var aff = ITEMS.filter(function(i){ return i.p <= rem; });
      var it = aff[Math.floor(Math.random() * aff.length)];
      var mq = Math.floor(rem / it.p);
      var q = 1 + Math.floor(Math.random() * Math.ceil(mq * 0.12));
      qty[it.id] = (qty[it.id] || 0) + q;
      rem -= q * it.p;
    }
    if (rem >= MINP){
      var ch = ITEMS.filter(function(i){ return i.p === MINP; })[0];
      qty[ch.id] = (qty[ch.id] || 0) + Math.floor(rem / MINP);
    }
    renderList();
  });

  function openSheet(){
    var s = spent(), rem = BUDGET - s;
    var per = {}, lines = [];
    DATA.forEach(function(c){ per[c.id] = {n:0, u:0, t:0}; });
    for (var k in qty){
      var it = byId[k];
      per[it.cat].n++; per[it.cat].u += qty[k]; per[it.cat].t += qty[k] * it.p;
      lines.push({it:it, q:qty[k], t:qty[k] * it.p});
    }
    lines.sort(function(a, b){ return b.t - a.t; });
    var catHTML = DATA.filter(function(c){ return per[c.id].n > 0; }).map(function(c){
      var p = per[c.id];
      return '<div class="ln"><span>' + c.name + '<small>' + p.n + ' 項 · ' + num(p.u) + ' 件</small></span><b>' + twd(p.t) + '</b></div>';
    }).join('');
    var pct = s / BUDGET * 100;
    var pctStr = pct.toLocaleString('en-US', {maximumFractionDigits: pct > 99 ? 4 : 1});
    var verdict = s === 0 ? '你還沒花半毛錢。' : (rem < MINP ? '全部花光，剩下的錢已買不起任何商品。' : '已花掉 ' + pctStr + '% 的資金。');
    var fn = Math.floor(rem / FERRARI);
    var ferHTML = fn > 0
      ? '還能買<b>' + num(fn) + '</b>台法拉利'
      : '連一台法拉利都買不起了';
    var date = new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'long', day:'numeric'});
    var detail = lines.length ? '<details><summary>完整購買清單（' + lines.length + ' 項）</summary>' + lines.map(function(l){
      return '<div class="ln"><span>' + l.it.name + '<small>' + twd(l.it.p) + ' × ' + num(l.q) + '</small></span><b>' + twd(l.t) + '</b></div>';
    }).join('') + '</details>' : '';
    $('#sheetBody').innerHTML =
      '<div class="rc">' +
        '<p class="eyebrow">結帳明細 · ' + date + '</p>' +
        '<h2>收據</h2>' +
        '<p class="verdict">' + verdict + '</p>' +
        (catHTML || '<div class="ln"><span>購物車是空的</span><b>NT$0</b></div>') +
        '<div class="ln tot"><span>總花費</span><b>' + twd(s) + '</b></div>' +
        '<div class="res">' +
          '<span class="lab">帳戶剩餘</span>' +
          '<p class="remain">' + twd(rem) + '</p>' +
          '<p class="zh" style="text-align:left;margin-top:2px">' + (rem >= 10000 ? zh(rem) + ' 元' : '') + '</p>' +
          '<p class="fer">' + ferHTML + '</p>' +
          '<p class="note">法拉利以 Purosangue 約 US$400,000（' + twd(FERRARI) + '）換算</p>' +
        '</div>' +
        detail +
        '<div class="acts"><button class="go" id="keep" type="button">繼續購物</button><button class="ghost" id="again" type="button">重新開始</button></div>' +
      '</div>';
    $('#sheet').hidden = false;
    $('#sheet').scrollTop = 0;
    document.body.style.overflow = 'hidden';
    $('#keep').focus();
    $('#keep').addEventListener('click', closeSheet);
    $('#again').addEventListener('click', function(){
      for (var k in qty) delete qty[k];
      closeSheet(); renderList();
    });
  }
  function closeSheet(){
    $('#sheet').hidden = true;
    document.body.style.overflow = '';
    $('#go').focus();
  }
  $('#go').addEventListener('click', openSheet);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  });

  renderTabs();
  renderList();
})();
</script>
